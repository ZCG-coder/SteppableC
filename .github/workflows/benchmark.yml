name: benchmark
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: benchmark
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
          cache: 'pip'
      - run: pip install meson ninja

      - name: set up meson
        env:
          CC: ${{ matrix.cc }}
        run: meson setup build --buildtype=release --warnlevel=2

      - name: compile
        run: meson compile -C build

      - name: test
        run: meson compile -C build run_benchmarks

      - name: report
        uses: actions/upload-artifact@v7
        with:
          name: benchmark_stats
          path: build/benchmarks
